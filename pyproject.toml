[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-analytics-platform"
version = "0.1.0"
description = "Real-time crypto analytics pipeline: Polars + GCP BigQuery + Airflow + Terraform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Alejandro Camerlengo" }]
keywords = ["crypto", "analytics", "data-engineering", "bigquery", "airflow", "polars"]

[project.dependencies]
# Dependencias de producción — se instalan progresivamente por Issue
# Issue #1 (Extractor): httpx, pydantic
# Issue #2 (Transformer): polars
# Issue #3 (Loader): google-cloud-bigquery, google-cloud-storage
# Issue #4 (Airflow): apache-airflow

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
